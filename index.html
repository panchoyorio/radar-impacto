<!doctype html><html lang=es><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Radar de impacto</title></head><body style=background:#E6E9E1><script id=datos type=application/json>{"f": "2026-10-09", "r": ["DATOS DE EJEMPLO (ficticios). El desempleo sube y la construcción sigue débil: presión sobre la masa cotizante del sector con mayor peso en la cartera.", "EJEMPLO: SUSESO cambia los plazos de calificación de enfermedades profesionales; exige ajustar procesos antes de diciembre.", "EJEMPLO: IPC sobre lo esperado; presiona el reajuste de prestaciones y los costos médicos."], "k": [{"n": "IPC", "p": "sep-2026", "v": "0,4%", "x": "12 meses: 4,1% (ant. 3,9%)", "e": "D", "l": "Sobre lo esperado; presiona costos.", "s": "INE", "u": "https://www.ine.gob.cl", "k": "8-nov"}, {"n": "IMACEC", "p": "ago-2026", "v": "1,8%", "x": "a/a · no minero 1,2%", "e": "N", "l": "Actividad moderada.", "s": "Banco Central", "u": "https://www.bcentral.cl", "k": "1-nov"}, {"n": "Desempleo", "p": "jun-ago 2026", "v": "8,9%", "x": "+0,2 pp a/a", "e": "D", "l": "Menos cotizantes en la cartera.", "s": "INE", "u": "https://www.ine.gob.cl", "k": "30-oct"}], "n": [{"t": "EJEMPLO: Empleo en construcción cae 3,4% en 12 meses", "u": "https://www.ine.gob.cl/ejemplo/empleo-sectorial", "s": "INE", "f": "2026-10-08", "c": "Mercado laboral", "i": "A", "o": "R", "r": "El empleo en construcción cayó 3,4% en doce meses en el trimestre junio-agosto, según la encuesta del instituto de estadísticas. El sector perdió cerca de 25 mil ocupados en el período, la mayor baja entre todas las ramas de actividad.\n\nLa caída se concentra en trabajadores asalariados formales y en la Región Metropolitana. Economistas consultados prevén que el empleo sectorial seguirá débil hasta mediados de 2027, en línea con la baja de permisos de edificación.", "p": "Menos empleo formal en el sector de mayor peso de la cartera reduce trabajadores protegidos y cotizaciones."}, {"t": "EJEMPLO: Permisos de edificación caen 12% en el año", "u": "https://www.cchc.cl/ejemplo/permisos-edificacion", "s": "CChC", "f": "2026-10-08", "c": "Construcción", "i": "A", "o": "R", "r": "Los permisos de edificación acumulan una caída de 12% entre enero y agosto, según el último informe gremial. La baja se concentra en vivienda en altura en la Región Metropolitana, donde la superficie autorizada es la menor en una década, mientras que las regiones del norte muestran una leve recuperación.\n\nEl gremio atribuye la caída a las altas tasas de financiamiento y a la demora en la tramitación de permisos municipales. Advierte que la menor cartera de proyectos anticipa menos actividad y contratación durante 2027, y pidió al Gobierno acelerar las medidas de reactivación anunciadas en junio.", "p": "Construcción es el sector de mayor peso en la cartera: menos obras futuras reducen empleo formal y cotizaciones."}, {"t": "EJEMPLO: Ventas del comercio minorista crecen 3,1%", "u": "https://www.cnc.cl/ejemplo/ventas-comercio", "s": "CNC", "f": "2026-10-08", "c": "Comercio", "i": "M", "o": "O", "r": "Las ventas del comercio minorista crecieron 3,1% anual en septiembre, según la Cámara Nacional de Comercio. El alza se explica principalmente por bienes durables, como electrodomésticos y vestuario, y por el efecto de las fiestas patrias, que este año tuvieron un fin de semana largo.\n\nEl gremio proyecta un cierre de año con crecimiento moderado, aunque advierte que el alto desempleo podría frenar el consumo en el primer trimestre. Las grandes cadenas anunciaron contrataciones de temporada para diciembre.", "p": "Comercio pesa en la cartera: más ventas pueden sostener contratación y masa salarial en adherentes del rubro."}, {"t": "EJEMPLO: Exportaciones agrícolas repuntan con la temporada de cerezas", "u": "https://www.df.cl/ejemplo/exportaciones-cerezas", "s": "Diario Financiero", "f": "2026-10-07", "c": "Agro y pesca", "i": "B", "o": "O", "r": "Los gremios agrícolas proyectan una temporada de cerezas con envíos récord, superiores en un 15% a los del año anterior. Las empresas anticipan mayor contratación estacional entre noviembre y febrero, sobre todo en packings de las regiones de O'Higgins y Maule.\n\nEl principal destino seguirá siendo China, aunque los exportadores buscan diversificar hacia India y el sudeste asiático. Los productores advierten que la falta de mano de obra podría encarecer las cosechas.", "p": "Alza temporal de empleo formal en empresas agrícolas adherentes durante la temporada."}, {"t": "EJEMPLO: SUSESO emite circular sobre calificación de enfermedades profesionales", "u": "https://www.suseso.cl/ejemplo/circular-calificacion", "s": "SUSESO", "f": "2026-10-07", "c": "Regulación y seguridad laboral", "i": "A", "o": "N", "r": "La Superintendencia de Seguridad Social publicó una circular que modifica los plazos y procedimientos para calificar enfermedades profesionales. Los organismos administradores deberán resolver en menos días hábiles y documentar cada etapa del proceso, incluida la evaluación del puesto de trabajo.\n\nLa norma entra en vigencia el 1 de diciembre y contempla un período de marcha blanca de tres meses. La Superintendencia señaló que fiscalizará el cumplimiento a partir de marzo y que publicará indicadores de plazos por organismo administrador.", "p": "Obligación regulatoria directa para la Mutual: exige ajustar procesos de calificación y plazos antes de diciembre."}, {"t": "EJEMPLO: Senado aprueba en general proyecto que modifica la Ley 16.744", "u": "https://www.senado.cl/ejemplo/proyecto-16744", "s": "Senado", "f": "2026-10-07", "c": "Regulación y seguridad laboral", "i": "M", "o": "N", "r": "La Sala del Senado aprobó en general el proyecto que amplía la cobertura de enfermedades de salud mental de origen laboral dentro de la Ley 16.744. La votación fue de 32 votos a favor y 6 en contra.\n\nLa iniciativa pasa ahora a la comisión de Trabajo para su discusión en particular. El Ejecutivo anunció indicaciones para noviembre, entre ellas reglas sobre el financiamiento de las nuevas prestaciones y los plazos de calificación.", "p": "Cambio regulatorio que podría aumentar prestaciones y costos de la Mutual; conviene seguir su tramitación."}, {"t": "EJEMPLO: ACHS lanza nuevo programa de prevención para pymes", "u": "https://www.achs.cl/ejemplo/programa-pymes", "s": "ACHS", "f": "2026-10-06", "c": "Sector mutualidades", "i": "B", "o": "R", "r": "Otra mutualidad presentó un programa de prevención dirigido a empresas de menos de 50 trabajadores. Incluye asesoría remota, un diagnóstico de riesgos en línea y capacitación gratuita durante el primer año de adhesión.\n\nLa iniciativa se lanzará primero en tres regiones con alta concentración de pymes y luego se extenderá al resto del país. La mutualidad indicó que busca duplicar su cartera de pequeñas empresas en dos años.", "p": "Movimiento competitivo en el segmento pyme que podría atraer empresas adherentes de la Mutual."}, {"t": "EJEMPLO: Constructora mediana se acoge a reorganización judicial", "u": "https://www.df.cl/ejemplo/constructora-reorganizacion", "s": "Diario Financiero", "f": "2026-10-06", "c": "Empresas adherentes", "i": "M", "o": "R", "r": "Una constructora con cerca de 900 trabajadores inició un proceso de reorganización judicial ante el tribunal civil de Santiago. La empresa tiene doce obras en curso, la mayoría de vivienda social, y deudas con bancos y proveedores por montos que no se informaron.\n\nLa compañía atribuye su situación a la caída de proyectos privados y al alza de costos financieros. Los acreedores votarán el plan en las próximas semanas; mientras tanto, la empresa mantiene sus faenas y asegura que pagará las remuneraciones al día.", "p": "Riesgo de insolvencia: posible pérdida de trabajadores cotizantes y deuda de cotizaciones de una empresa del sector."}]}</script><script src="radar.js" onerror="document.body.textContent='No se pudo cargar el diseño del Radar (revisa la conexión). El resumen está en el chat de Copilot.'"></script></body></html>
